<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="28" fill="#028DFA"/>
  <!-- Connecting Spokes -->
  <line x1="50" y1="50" x2="50" y2="25" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="74" y2="42" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="65" y2="73" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="35" y2="73" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="26" y2="42" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Central Node -->
  <circle cx="50" cy="50" r="8" fill="#028DFA" stroke="#FFFFFF" stroke-width="4.5"/>
  <!-- 5 Outer Nodes -->
  <circle cx="50" cy="25" r="6" fill="#028DFA" stroke="#FFFFFF" stroke-width="4.5"/>
  <circle cx="74" cy="42" r="6" fill="#028DFA" stroke="#FFFFFF" stroke-width="4.5"/>
  <circle cx="65" cy="73" r="6" fill="#028DFA" stroke="#FFFFFF" stroke-width="4.5"/>
  <circle cx="35" cy="73" r="6" fill="#028DFA" stroke="#FFFFFF" stroke-width="4.5"/>
  <circle cx="26" cy="42" r="6" fill="#028DFA" stroke="#FFFFFF" stroke-width="4.5"/>
</svg>
